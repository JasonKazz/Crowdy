[project]
name = "crowdy-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2,<3",
  "shapely>=2,<3",
  "jupedsim==1.4.2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "Pillow>=10,<14",
  "python-dotenv>=1,<2",
  "vercel-blob>=0.5.0,<1",
  "azure-storage-blob>=12.23,<13",
  "azure-identity>=1.19,<2",
]

[tool.vercel]
entrypoint = "app.api:app"

# JuPedSim's simulator needs these dependencies. Its desktop visualizer also
# declares PySide6 and VTK, which the HTTP API never imports or uses.
[[tool.uv.dependency-metadata]]
name = "jupedsim"
version = "1.4.2"
requires-dist = ["numpy~=2.2", "shapely~=2.0", "deprecated~=1.2.18"]
