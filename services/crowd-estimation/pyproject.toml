[project]
name = "crowdy-crowd-estimation"
version = "0.1.0"
description = "Independent still-image person detection API for Crowdy"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1,<2",
  "Pillow>=11,<14",
  "ultralytics>=8.4,<9",
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
  "timm==1.0.16",
]

[dependency-groups]
dev = ["httpx>=0.28,<1"]

# Linux containers use CPU wheels instead of pulling CUDA runtimes. macOS uses
# the normal PyPI wheels for local development.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
